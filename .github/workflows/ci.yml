name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Type check
        run: |
          pnpm exec tsc --noEmit -p src/bot/tsconfig.json
          pnpm exec tsc --noEmit -p src/parser/tsconfig.json
          pnpm exec tsc --noEmit -p src/sendout/tsconfig.json
          
      - name: Build
        run: |
          pnpm run build:bot
          pnpm run build:parser
          pnpm run build:sendout

      - name: Package release
        run: |
          tar -czf release.tar.gz \
            .env \
            dist/ \
            src/shared/db/generated/ \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml

      - name: Deploy to server
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY_SHREK_SWAMP }}
          HOST: ${{ secrets.SSH_HOST_SHREK_SWAMP }}
          USER: ${{ secrets.SSH_USER_SHREK_SWAMP }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          scp -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            release.tar.gz \
            $USER@$HOST:/srv/telegram-projects/ugly-duckling/releases/

          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            $USER@$HOST \
            "bash /srv/telegram-projects/ugly-duckling/deploy.sh"

          rm /tmp/deploy_key